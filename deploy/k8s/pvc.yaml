# Home: sessions, credentials, settings, and the browser cookie signing key.
# Workspace: the directory the agent edits. Tools: user-space installs the agent
# makes for itself. They are separate claims because each is wiped on its own
# schedule and only the home is state worth backing up.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dsh-home
  namespace: dsh
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dsh-workspace
  namespace: dsh
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dsh-tools
  namespace: dsh
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 4Gi
